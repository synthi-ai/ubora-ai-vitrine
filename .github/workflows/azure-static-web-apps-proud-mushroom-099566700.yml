name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

env:
  NODE_VERSION: '18'
  SWA_WORKFLOW_TIMEOUT: '900' # Augmente le timeout à 15 minutes
  SWA_MAX_FUNCTION_SIZE: '500000000' # Augmente la limite à ~500MB

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: true # Active LFS pour les gros fichiers
          fetch-depth: 0 # Récupère toute l'historique pour les sous-modules

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
            **/.next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci
          npm run build

      - name: Clean up before deploy
        run: |
          # Supprime les fichiers inutiles pour réduire la taille
          find . -type d -name "node_modules" -exec rm -rf {} + || true
          rm -rf .git .github .vscode tests e2e

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_MUSHROOM_099566700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api" # Si vous avez une API
          output_location: ".next" # Pour Next.js
          skip_app_build: true # Si vous avez déjà fait le build
          skip_api_build: true # Si vous avez déjà fait le build API
          verbose: true # Active les logs détaillés

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_MUSHROOM_099566700 }}
          action: "close"
